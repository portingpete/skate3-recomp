name: Lint & Format Check

on:
  pull_request:
    paths:
      - "include/**"
      - "src/**"
      - "tests/**"
      - ".clang-format"
  push:
    branches:
      - "**"
    paths:
      - "include/**"
      - "src/**"
      - "tests/**"
      - ".clang-format"

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y clang-format-20

      # - name: Install cmake-format
        # run: pip install cmake-format

      - name: Check C/C++ formatting
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            mapfile -t changed_files < <(git diff --name-only --diff-filter=ACM "origin/${{ github.base_ref }}"...HEAD)
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            mapfile -t changed_files < <(git diff-tree --no-commit-id --name-only -r HEAD)
          else
            mapfile -t changed_files < <(git diff --name-only --diff-filter=ACM "${{ github.event.before }}" "${{ github.sha }}")
          fi

          format_files=()
          for file in "${changed_files[@]}"; do
            case "$file" in
              include/*|src/*|tests/*) ;;
              *) continue ;;
            esac

            case "$file" in
              *.cpp|*.h|*.hpp|*.c|*.cc|*.hh|*.cxx|*.hxx)
                if [[ -f "$file" ]]; then
                  format_files+=("$file")
                fi
                ;;
            esac
          done

          if (( ${#format_files[@]} == 0 )); then
            echo "No changed C/C++ files to check."
            exit 0
          fi

          printf '%s\0' "${format_files[@]}" | xargs -0 clang-format-20 --dry-run --Werror
